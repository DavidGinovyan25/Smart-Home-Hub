
################################## NETWORK #####################################

# Network interfaces/IP addresses the server listens on.
bind 0.0.0.0

# Protects the server from unsafe remote access.
protected-mode no

# TCP port used by the server.
port 6379

# Maximum queue length for pending TCP connections.
tcp-backlog 511

# Disconnect idle clients after N seconds (0 = never).
timeout 0

# Interval for TCP keepalive probes.
tcp-keepalive 300

################################## GENERAL #####################################

# Run as a background daemon.
daemonize no


# Logging verbosity.
loglevel notice

# Log destination (empty = stdout).
logfile ""

# Number of logical databases.
databases 16

# Display the Valkey logo on startup.
always-show-logo no

# Hide user data in logs.
hide-user-data-from-log yes

# Set the process title.
set-proc-title yes

# Template used for the process title.
proc-title-template "{title} {listen-addr} {server-mode}"

# Locale used for string collation.
locale-collate ""

################################ SNAPSHOTTING ##################################

# Stop writes if an RDB background save fails.
stop-writes-on-bgsave-error yes

# Compress RDB snapshots.
rdbcompression yes

# Add a checksum to RDB snapshots.
rdbchecksum yes

# Verify RDB version compatibility.
rdb-version-check strict

# Name of the RDB snapshot file.
dbfilename dump.rdb

# Remove temporary replication sync files.
rdb-del-sync-files no

# Working directory for persistence files.
dir /data



################################## SECURITY ####################################

# Maximum ACL log length.
acllog-max-len 128

############################# LAZY FREEING #####################################

# Free evicted keys asynchronously.
lazyfree-lazy-eviction yes

# Free expired keys asynchronously.
lazyfree-lazy-expire yes

# Perform server-side deletions asynchronously.
lazyfree-lazy-server-del yes


# DEL command frees memory asynchronously.
lazyfree-lazy-user-del yes

# FLUSHDB/FLUSHALL free memory asynchronously.
lazyfree-lazy-user-flush yes

############################ KERNEL OOM CONTROL ################################

# Adjust the Linux OOM score.
oom-score-adj no

# OOM score values for different Valkey processes.
oom-score-adj-values 0 200 800

#################### KERNEL TRANSPARENT HUGEPAGE CONTROL #######################

# Attempt to disable Transparent Huge Pages.
disable-thp yes

############################## APPEND ONLY MODE ################################

# Enable Append Only File persistence.
appendonly yes

# Name of the AOF file.
appendfilename "appendonly.aof"

# Directory used for AOF files.
appenddirname "appendonlydir"

# How often to fsync the AOF.
appendfsync everysec

# Skip fsync during AOF rewrite.
no-appendfsync-on-rewrite no

# Rewrite AOF after this percentage growth.
auto-aof-rewrite-percentage 100

# Minimum AOF size before rewrite.
auto-aof-rewrite-min-size 64mb

# Load truncated AOF files if possible.
aof-load-truncated yes

# Start rewritten AOF with an RDB snapshot.
aof-use-rdb-preamble yes

# Include timestamps in AOF.
aof-timestamp-enabled no

############################ COMMAND LOG #######################################

# Log commands slower than this threshold.
commandlog-execution-slower-than 10000

# Maximum number of slow-command log entries.
commandlog-slow-execution-max-len 128

# Log requests larger than this size.
commandlog-request-larger-than 1048576

# Maximum number of large-request log entries.
commandlog-large-request-max-len 128

# Log replies larger than this size.
commandlog-reply-larger-than 1048576

# Maximum number of large-reply log entries.
commandlog-large-reply-max-len 128

################################## LATENCY #####################################

# Enable latency monitoring above this threshold.
latency-monitor-threshold 0

############################## DATA STRUCTURES #################################

# Publish keyspace/keyevent notifications.
notify-keyspace-events ""

# Thresholds for compact encodings of data structures.
hash-max-listpack-entries 512
hash-max-listpack-value 64
list-max-listpack-size -2
list-compress-depth 0
set-max-intset-entries 512
set-max-listpack-entries 128
set-max-listpack-value 64
zset-max-listpack-entries 128
zset-max-listpack-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100

# Enable background hash table rehashing.
activerehashing yes

################################## CLIENTS #####################################

# Output buffer limits for different client types.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

################################ PERFORMANCE ##################################

# Frequency of internal background tasks.
hz 10

# Incremental fsync during AOF rewrite.
aof-rewrite-incremental-fsync yes

# Incremental fsync during RDB save.
rdb-save-incremental-fsync yes

# Enable jemalloc background threads.
jemalloc-bg-thread yes


############################ MEMORY MANAGEMENT ###############################

# Maximum memory Valkey can use.
maxmemory 1gb

# Eviction policy when memory limit is reached.
maxmemory-policy allkeys-lru